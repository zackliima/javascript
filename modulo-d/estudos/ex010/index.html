<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Multas</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    <div>
        <p>
            Velocidade do carro:
            <input type="number" name="txtvel" id="txtvel">
            <input type="button" value="Verificar" onclick="calcular()">
            <p id="res"></p>
        </p>
    </div>

    <script>
        function calcular() {
            var txtvel = document.querySelector('input#txtvel')
            var res = document.querySelector('p#res')
            var vel = Number(txtvel.value)

            res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}Km/h</strong></p>`

            if (vel > 60) {
                res.innerHTML += '<p>Você ultrapassou o limite de velocidade e será <strong>multado!</trong></p>'
            }

            res.innerHTML += 'Se beber não dirija, use sempre o cinto de segurança e respeite as <strong>leis de trânsito!</trong>'
        }
    </script>
</body>
</html>
