<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Intermediate - 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Approval System</h1>
        <p>Enter the student's average grade and attendance to determine whether they have passed, failed, or are required to take a remedial assessment.</p>
    </header>


    <section>
        <div id="form">
            <p> 
                <label for="grade">Student Grade: </label>
                <input type="number" id="grade" name="grade" min="0" max="10" step="0.1" required>
            </p>
            <p> 
                <label for="attendance">Student Attendance: </label>
                <input type="range" id="attendance" name="attendance" min="0" max="100" value="75">
                <output id="result">75</output>
            </p>
            <p>
                <input type="button" value="Validate" onclick="check()">
            </p>
        </div>
        <div id="res">
            
        </div>
    </section>

    <footer>
        <p>&copy; ZCK&trade; Technologies.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
